# Installed system only — SDDM greeter defaults for lfs-from-freebsd.
# Merged by install-to-zfs.sh / chapter 1500-desktop-overlay.sh.
# See docs/DESKTOP-PLASMA6.md

[Theme]
Current=breeze

[Users]
MaximumUid=60000

[General]
# Wayland-first Plasma session; X11 remains available if installed.
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lock --locale1
SessionCommand=/usr/bin/startplasma-wayland
